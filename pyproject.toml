[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "stats-for-ai"
version = "0.1.0"
description = "AIR-003 educational statistical methods"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2"]
[project.optional-dependencies]
research = ["numpy==2.3.5", "scipy==1.17.0", "matplotlib>=3.9,<4", "pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
